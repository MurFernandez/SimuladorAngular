<div class="container">
  <h2>Cadastrar Nova Tarefa</h2>
  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Descrição:</label>
      <input type="text" [(ngModel)]="descricao" name="descricao" required />
    </div>
    <div>
      <label>Prazo de Conclusão:</label>
      <input type="date" [(ngModel)]="prazo" name="prazo" required />
    </div>
    <button type="submit">Cadastrar</button>
  </form>
  <br>
  <a routerLink="/lista">Ir para a Lista de Tarefas</a>
</div>
